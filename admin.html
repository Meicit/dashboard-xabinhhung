<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cập nhật số liệu Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-focus:focus { outline: none; border-color: #2563eb; ring: 2px; ring-color: #bfdbfe; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
            <div>
                <h1 class="text-2xl font-black text-blue-900 uppercase italic">Hệ Thống Quản Trị Dữ Liệu</h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">UBND Xã Bình Hưng - Cập nhật 2026</p>
            </div>
            <div class="flex gap-3">
                <button onclick="saveData()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all active:scale-95 uppercase text-sm tracking-wider">
                    🚀 Cập nhật dữ liệu
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-8">
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-red-600 text-white font-bold uppercase text-xs tracking-wider flex justify-between">
                    <span>1. Quản lý Đơn thư & Tiếp dân</span>
                    <span class="opacity-75 text-[10px]">Tự động tổng hợp số liệu</span>
                </div>
                <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 italic text-red-600">Số lượt tiếp công dân</label>
                        <input type="number" id="det_dt_tiep_dan" class="w-full p-2 border rounded font-black text-slate-700" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 italic text-red-600">Tổng đơn nhận trong kỳ</label>
                        <input type="number" id="det_dt_tong_nhan" class="w-full p-2 border rounded font-black text-slate-700" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 italic text-red-600">Đơn thuộc thẩm quyền</label>
                        <input type="number" id="det_dt_tham_quyen" class="w-full p-2 border rounded font-black text-slate-700" placeholder="0">
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                        <label class="block text-[10px] font-bold text-emerald-600 uppercase mb-1">Đơn đã giải quyết xong</label>
                        <input type="number" id="det_dt_xong" class="w-full p-2 border border-emerald-200 rounded font-black text-emerald-700 bg-white" placeholder="0">
                    </div>
                    <div class="bg-orange-50 p-3 rounded-lg border border-orange-100">
                        <label class="block text-[10px] font-bold text-orange-600 uppercase mb-1">Đơn đang giải quyết</label>
                        <input type="number" id="det_dt_dang_xl" class="w-full p-2 border border-orange-200 rounded font-black text-orange-700 bg-white" placeholder="0">
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-orange-500 text-white font-bold uppercase text-xs tracking-wider">2. Quản lý Phản ánh 1022</div>
                <div class="p-6">
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                        <div><label class="text-[9px] font-bold text-slate-400 uppercase">Tiếng ồn</label><input type="number" id="pa_det_tieng_on" class="w-full p-2 border rounded font-bold" placeholder="0"></div>
                        <div><label class="text-[9px] font-bold text-slate-400 uppercase">Kinh tế/HT</label><input type="number" id="pa_det_kinh_te" class="w-full p-2 border rounded font-bold" placeholder="0"></div>
                        <div><label class="text-[9px] font-bold text-slate-400 uppercase">Trật tự ĐT</label><input type="number" id="pa_det_trat_tu" class="w-full p-2 border rounded font-bold" placeholder="0"></div>
                        <div><label class="text-[9px] font-bold text-slate-400 uppercase">Văn hóa/XH</label><input type="number" id="pa_det_van_hoa" class="w-full p-2 border rounded font-bold" placeholder="0"></div>
                        <div><label class="text-[9px] font-bold text-slate-400 uppercase">Hành chính</label><input type="number" id="pa_det_hcc" class="w-full p-2 border rounded font-bold" placeholder="0"></div>
                        <div><label class="text-[9px] font-bold text-slate-400 uppercase">Khác</label><input type="number" id="pa_det_khac" class="w-full p-2 border rounded font-bold" placeholder="0"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tổng cộng (1022)</label>
                            <input type="number" id="pa_1022_tong" class="w-full p-2 border rounded font-black text-orange-600 bg-orange-50" readonly placeholder="Tự tính">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 text-emerald-600">Đã giải quyết</label>
                            <input type="number" id="pa_1022_xong" class="w-full p-2 border rounded font-black text-emerald-600" placeholder="0">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Đánh giá chung</label>
                            <input type="text" id="pa_1022_danh_gia" class="w-full p-2 border rounded font-bold text-slate-600" placeholder="Tốt/Khá/Trung bình">
                        </div>
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-blue-600 text-white font-bold uppercase text-xs tracking-wider">3. Quản lý Hồ sơ Hành chính (Tháng/Lũy kế)</div>
                <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                        <label class="block text-[10px] font-bold text-blue-600 uppercase mb-1 italic">Tổng hồ sơ tiếp nhận</label>
                        <input type="number" id="hs_tong_input" class="w-full p-2 border border-blue-200 rounded font-black text-blue-900" placeholder="VD: 1696">
                    </div>
                    <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                        <label class="block text-[10px] font-bold text-red-600 uppercase mb-1 italic">Số hồ sơ TRỄ HẠN</label>
                        <input type="number" id="hs_tre_input" class="w-full p-2 border border-red-200 rounded font-black text-red-700" placeholder="VD: 16">
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                        <label class="block text-[10px] font-bold text-emerald-600 uppercase mb-1 italic">Số hồ sơ TRỰC TUYẾN</label>
                        <input type="number" id="hs_online_input" class="w-full p-2 border border-emerald-200 rounded font-black text-emerald-700" placeholder="VD: 1651">
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-emerald-600 text-white font-bold uppercase text-xs tracking-wider">4. Cập nhật 30 Chỉ tiêu Kinh tế (%)</div>
                <div id="ct_container" class="p-6 grid grid-cols-2 md:grid-cols-5 gap-4">
                    </div>
            </section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        // Tự động tạo 30 ô nhập chỉ tiêu
        const container = document.getElementById('ct_container');
        for(let i=1; i<=30; i++) {
            const div = document.createElement('div');
            div.innerHTML = `
                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1 tracking-tighter">Chỉ tiêu ${i}</label>
                <input type="number" id="ct_${i}" class="w-full p-2 border border-slate-200 rounded font-bold text-emerald-700 bg-slate-50 focus:bg-white" placeholder="0">
            `;
            container.appendChild(div);
        }

        // Tự tính tổng 1022 khi nhập các lĩnh vực
        const paInputs = ['pa_det_tieng_on','pa_det_kinh_te','pa_det_trat_tu','pa_det_van_hoa','pa_det_hcc','pa_det_khac'];
        paInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                let total = 0;
                paInputs.forEach(inputId => total += (parseInt(document.getElementById(inputId).value) || 0));
                document.getElementById('pa_1022_tong').value = total;
            });
        });

        // Tải dữ liệu cũ lên để sửa
        onValue(ref(db, 'dashboard_binhhung'), (snap) => {
            const d = snap.val();
            if(!d) return;
            
            // Đổ lại đơn thư
            if(d.don_thu_detail) {
                document.getElementById('det_dt_tiep_dan').value = d.don_thu_detail.tiep_dan || 0;
                document.getElementById('det_dt_tong_nhan').value = d.don_thu_detail.tong_nhan || 0;
                document.getElementById('det_dt_tham_quyen').value = d.don_thu_detail.tham_quyen || 0;
                document.getElementById('det_dt_xong').value = d.don_thu.xong || 0;
                document.getElementById('det_dt_dang_xl').value = d.don_thu.dang_xl || 0;
            }

            // Đổ lại 1022
            if(d.pa_1022_detail) {
                document.getElementById('pa_det_tieng_on').value = d.pa_1022_detail.tieng_on || 0;
                document.getElementById('pa_det_kinh_te').value = d.pa_1022_detail.kinh_te_ha_tang || 0;
                document.getElementById('pa_det_trat_tu').value = d.pa_1022_detail.trat_tu_do_thi || 0;
                document.getElementById('pa_det_van_hoa').value = d.pa_1022_detail.van_hoa_xa_hoi || 0;
                document.getElementById('pa_det_hcc').value = d.pa_1022_detail.han_chinh_cong || 0;
                document.getElementById('pa_det_khac').value = d.pa_1022_detail.khac || 0;
                document.getElementById('pa_1022_tong').value = d.pa_1022.tong || 0;
                document.getElementById('pa_1022_xong').value = d.pa_1022.da_giai_quyet || 0;
                document.getElementById('pa_1022_danh_gia').value = d.pa_1022.danh_gia || "";
            }

            // Đổ lại Hồ sơ TTHC
            if(d.ho_so) {
                document.getElementById('hs_tong_input').value = d.ho_so.tong || 0;
                document.getElementById('hs_tre_input').value = d.ho_so.quahan || 0;
                document.getElementById('hs_online_input').value = d.ho_so.online || 0;
            }

            // Đổ lại 30 chỉ tiêu
            if(d.chi_tieu) {
                for(let i=1; i<=30; i++) {
                    document.getElementById(`ct_${i}`).value = d.chi_tieu[`ct_${i}`] || 0;
                }
            }
        });

        // HÀM LƯU DỮ LIỆU
        window.saveData = () => {
            const getV = (id) => parseInt(document.getElementById(id).value) || 0;
            
            const payload = {
                // ĐƠN THƯ
                don_thu: {
                    tong: getV('det_dt_tong_nhan'),
                    xong: getV('det_dt_xong'),
                    dang_xl: getV('det_dt_dang_xl')
                },
                don_thu_detail: {
                    tiep_dan: getV('det_dt_tiep_dan'),
                    tong_nhan: getV('det_dt_tong_nhan'),
                    tham_quyen: getV('det_dt_tham_quyen')
                },
                // 1022
                pa_1022: {
                    tong: getV('pa_1022_tong'),
                    da_giai_quyet: getV('pa_1022_xong'),
                    chua_giai_quyet: getV('pa_1022_tong') - getV('pa_1022_xong'),
                    danh_gia: document.getElementById('pa_1022_danh_gia').value
                },
                pa_1022_detail: {
                    tieng_on: getV('pa_det_tieng_on'),
                    kinh_te_ha_tang: getV('pa_det_kinh_te'),
                    trat_tu_do_thi: getV('pa_det_trat_tu'),
                    van_hoa_xa_hoi: getV('pa_det_van_hoa'),
                    han_chinh_cong: getV('pa_det_hcc'),
                    khac: getV('pa_det_khac')
                },
                // HỒ SƠ TTHC
                ho_so: {
                    tong: getV('hs_tong_input'),
                    quahan: getV('hs_tre_input'),
                    online: getV('hs_online_input')
                },
                // CHỈ TIÊU
                chi_tieu: {},
                // VĂN BẢN (Mặc định tạm thời)
                van_ban: { tong: 125 } 
            };

            for(let i=1; i<=30; i++) {
                payload.chi_tieu[`ct_${i}`] = getV(`ct_${i}`);
            }

            set(ref(db, 'dashboard_binhhung'), payload)
                .then(() => alert('✅ Đã cập nhật dữ liệu thành công!'))
                .catch((e) => alert('❌ Lỗi: ' + e));
        };
    </script>
</body>
</html>
