<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - UBND Xã Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding: 2rem; }
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 2rem; }
        label { display: block; font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; outline: none; }
        .btn-save { background: #2563eb; color: white; font-weight: 900; padding: 1rem 3rem; border-radius: 12px; transition: all 0.2s; }
        .btn-save:hover { background: #1e40af; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b pb-6">
            <h1 class="text-2xl font-black uppercase italic">Quản trị Dashboard 2026</h1>
            <button onclick="saveAll()" class="btn-save">LƯU TẤT CẢ DỮ LIỆU</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="card border-t-4 border-blue-600">
                <h2 class="font-black text-blue-600 uppercase mb-4 italic">⚖️ Quản lý Hồ sơ TTHC</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Tổng hồ sơ</label><input type="number" id="hs_tong"></div>
                    <div><label class="text-blue-600">Đã giải quyết</label><input type="number" id="hs_da_giai_quyet" class="bg-blue-50"></div>
                    <div><label>Hồ sơ Trực tuyến</label><input type="number" id="hs_online"></div>
                    <div><label class="text-emerald-600">Số Đúng hạn (Số lượng)</label><input type="number" id="hs_dung_han_count" class="bg-emerald-50"></div>
                </div>
                <div class="mt-4 pt-4 border-t"><label>Văn bản chỉ đạo</label><input type="number" id="vb_tong"></div>
            </section>

            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            authDomain: "dashboarb-xabinhhung.firebaseapp.com",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
            appId: "1:152638135861:web:128ac8d51c8357b6521b7c"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        const rootRef = ref(db, 'dashboard_binhhung');

        window.saveAll = () => {
            const data = {
                // Cấu trúc Hồ sơ mới
                ho_so: {
                    tong: Number(document.getElementById('hs_tong').value),
                    da_giai_quyet: Number(document.getElementById('hs_da_giai_quyet').value),
                    truc_tuyen: Number(document.getElementById('hs_online').value),
                    dung_han_count: Number(document.getElementById('hs_dung_han_count').value)
                },
                van_ban: { tong: Number(document.getElementById('vb_tong').value) },
                // ... Các phần Đơn thư, 1022, Chỉ tiêu khác giữ nguyên logic lưu cũ
            };
            set(rootRef, data).then(() => alert("✅ Cập nhật thành công!")).catch(e => alert("❌ Lỗi: " + e));
        }

        // Logic onValue để tải lại dữ liệu cũ lên form...
    </script>
</body>
</html>
