<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị - UBND Xã Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .input-card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 0.25rem; }
        input { width: 100%; border: 2px solid #e2e8f0; border-radius: 0.5rem; padding: 0.5rem; font-weight: 700; color: #1e293b; transition: all 0.2s; }
        input:focus { border-color: #2563eb; outline: none; background-color: #f8fafc; }
        .section-header { font-weight: 900; color: #1e3a8a; border-left: 5px solid #2563eb; padding-left: 0.75rem; margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-blue-100">
            <div>
                <h1 class="text-2xl font-black text-blue-900 uppercase italic">Bảng Điều Khiển Dữ Liệu 2026</h1>
                <p class="text-slate-500 font-bold text-xs uppercase tracking-widest">UBND Xã Bình Hưng - Hệ Thống Cập Nhật Real-time</p>
            </div>
            <button onclick="updateData()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-10 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-2">
                <span>CẬP NHẬT DỮ LIỆU</span> 💾
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="input-card border-t-4 border-red-500">
                <h2 class="section-header">📂 Xử lý Đơn Thư</h2>
                <div class="space-y-4">
                    <div><label>Tổng số đơn</label><input type="number" id="dt_tong"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>Đã giải quyết</label><input type="number" id="dt_da_giai_quyet"></div>
                        <div><label>Đang xử lý</label><input type="number" id="dt_dang_giai_quyet"></div>
                    </div>
                </div>
            </div>

            <div class="input-card border-t-4 border-orange-500">
                <h2 class="section-header">📞 Phản ánh 1022</h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>Tổng phản ánh</label><input type="number" id="pa_tong"></div>
                        <div><label>Đã giải quyết</label><input type="number" id="pa_xong"></div>
                    </div>
                    <div><label>Đánh giá ngắn gọn</label><input type="text" id="pa_danh_gia" placeholder="VD: Đã xử lý tốt các vụ việc..."></div>
                </div>
            </div>

            <div class="input-card border-t-4 border-blue-500">
                <h2 class="section-header">⚖️ Văn bản & Hồ sơ</h2>
                <div class="space-y-4">
                    <div><label>Tổng hồ sơ hành chính</label><input type="number" id="hs_tong"></div>
                    <div><label>Tổng văn bản chỉ đạo</label><input type="number" id="vb_tong"></div>
                </div>
            </div>
        </div>

        <div class="input-card mb-8">
            <h2 class="section-header italic text-sm">📊 Phân loại phản ánh 1022 (Chi tiết)</h2>
            <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                <div><label>Tiếng ồn</label><input type="number" id="pa_tieng_on"></div>
                <div><label>Kinh tế/Hạ tầng</label><input type="number" id="pa_kinh_te"></div>
                <div><label>Trật tự đô thị</label><input type="number" id="pa_trat_tu"></div>
                <div><label>Văn hóa xã hội</label><input type="number" id="pa_van_hoa"></div>
                <div><label>Hành chính công</label><input type="number" id="pa_hcc"></div>
                <div><label>Khác</label><input type="number" id="pa_khac"></div>
            </div>
        </div>

        <div class="input-card">
            <h2 class="section-header">📈 30 Chỉ tiêu kinh tế - xã hội (%)</h2>
            <div id="indicators-container" class="grid grid-cols-2 md:grid-cols-5 gap-x-4 gap-y-6">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            authDomain: "dashboarb-xabinhhung.firebaseapp.com",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
            appId: "1:152638135861:web:128ac8d51c8357b6521b7c"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        
        const indicators = [
            "Tăng trưởng SP", "Thu ngân sách", "Giải ngân ĐTC", "BHYT", "BHXH",
            "Mầm non chuẩn", "Tiểu học chuẩn", "THCS chuẩn", "Phòng học", "Hoàn thành THCS",
            "Giảm nghèo", "Chuẩn NTM", "Ấp văn hóa", "Gia đình VH", "Tiêm chủng",
            "Việc làm", "Du lịch", "Nước sạch", "Rác thải", "Y tế",
            "Nước thải CN", "Hồ sơ đúng hạn", "Chữ ký số", "Nghĩa vụ QS", "Giảm tội phạm",
            "Phá án", "Giảm tai nạn", "Phòng cháy", "Ma túy", "1022 đúng hạn"
        ];

        // Render inputs cho 30 chỉ tiêu
        const container = document.getElementById('indicators-container');
        indicators.forEach((name, index) => {
            const id = index + 1;
            container.innerHTML += `
                <div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200">
                    <label class="truncate text-blue-700 font-bold">CT${id}: ${name}</label>
                    <input type="number" step="0.01" id="ct_${id}" class="bg-white border-blue-100">
                </div>
            `;
        });

        // Tự động load dữ liệu cũ
        async function loadData() {
            const snap = await get(ref(db, 'dashboard_binhhung'));
            if(snap.exists()) {
                const d = snap.val();
                
                // Đơn thư
                document.getElementById('dt_tong').value = d.don_thu?.tong || 0;
                document.getElementById('dt_da_giai_quyet').value = d.don_thu?.da_giai_quyet || 0;
                document.getElementById('dt_dang_giai_quyet').value = d.don_thu?.dang_giai_quyet || 0;

                // 1022
                document.getElementById('pa_tong').value = d.pa_1022?.tong || 0;
                document.getElementById('pa_xong').value = d.pa_1022?.da_giai_quyet || 0;
                document.getElementById('pa_danh_gia').value = d.pa_1022?.danh_gia || "";

                // Chi tiết 1022
                const det = d.pa_1022_detail || {};
                document.getElementById('pa_tieng_on').value = det.tieng_on || 0;
                document.getElementById('pa_kinh_te').value = det.kinh_te_ha_tang || 0;
                document.getElementById('pa_trat_tu').value = det.trat_tu_do_thi || 0;
                document.getElementById('pa_van_hoa').value = det.van_hoa_xa_hoi || 0;
                document.getElementById('pa_hcc').value = det.hanh_chinh_cong || 0;
                document.getElementById('pa_khac').value = det.khac || 0;

                // Hồ sơ & Văn bản
                document.getElementById('hs_tong').value = d.ho_so?.tong || 0;
                document.getElementById('vb_tong').value = d.van_ban?.tong || 0;

                // 30 chỉ tiêu
                if(d.chi_tieu) {
                    for(let i=1; i<=30; i++) {
                        const input = document.getElementById(`ct_${i}`);
                        if(input) input.value = d.chi_tieu[`ct_${i}`] || 0;
                    }
                }
            }
        }

        // Hàm cập nhật
        window.updateData = async function() {
            const chiTieu = {};
            for(let i=1; i<=30; i++) {
                chiTieu[`ct_${i}`] = parseFloat(document.getElementById(`ct_${i}`).value) || 0;
            }

            const data = {
                don_thu: {
                    tong: parseInt(document.getElementById('dt_tong').value) || 0,
                    da_giai_quyet: parseInt(document.getElementById('dt_da_giai_quyet').value) || 0,
                    dang_giai_quyet: parseInt(document.getElementById('dt_dang_giai_quyet').value) || 0
                },
                pa_1022: {
                    tong: parseInt(document.getElementById('pa_tong').value) || 0,
                    da_giai_quyet: parseInt(document.getElementById('pa_xong').value) || 0,
                    chua_giai_quyet: (parseInt(document.getElementById('pa_tong').value) || 0) - (parseInt(document.getElementById('pa_xong').value) || 0),
                    danh_gia: document.getElementById('pa_danh_gia').value
                },
                pa_1022_detail: {
                    tieng_on: parseInt(document.getElementById('pa_tieng_on').value) || 0,
                    kinh_te_ha_tang: parseInt(document.getElementById('pa_kinh_te').value) || 0,
                    trat_tu_do_thi: parseInt(document.getElementById('pa_trat_tu').value) || 0,
                    van_hoa_xa_hoi: parseInt(document.getElementById('pa_van_hoa').value) || 0,
                    hanh_chinh_cong: parseInt(document.getElementById('pa_hcc').value) || 0,
                    khac: parseInt(document.getElementById('pa_khac').value) || 0
                },
                ho_so: { tong: parseInt(document.getElementById('hs_tong').value) || 0 },
                van_ban: { tong: parseInt(document.getElementById('vb_tong').value) || 0 },
                chi_tieu: chiTieu
            };

            try {
                await set(ref(db, 'dashboard_binhhung'), data);
                alert("✅ CẬP NHẬT THÀNH CÔNG!");
            } catch(e) {
                alert("❌ LỖI: " + e.message);
            }
        }

        loadData();
    </script>
</body>
</html>
