<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Cập nhật số liệu Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-slate-100 text-slate-800">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border">
            <div>
                <h1 class="text-2xl font-black text-blue-900 uppercase">Quản Trị Dữ Liệu 2026</h1>
                <p class="text-slate-500 text-xs font-bold">UBND Xã Bình Hưng</p>
            </div>
            <button onclick="saveAllData()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg uppercase text-sm">
                Lưu Hệ Thống 💾
            </button>
        </header>

        <div class="grid grid-cols-1 gap-6">
            <section class="bg-white p-6 rounded-xl border">
                <h3 class="font-black text-red-600 mb-4 border-b pb-2 uppercase text-sm">1. Quản lý Đơn thư</h3>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-slate-50 p-4 rounded-lg">
                        <p class="font-bold text-xs mb-3 text-blue-800">PHẢN ÁNH, KIẾN NGHỊ</p>
                        <div class="space-y-2">
                            <label class="block text-[10px] text-slate-500">Đã GQ - Trong hạn</label>
                            <input type="number" id="dt_pa_dgq_th" class="w-full p-1 border rounded">
                            <label class="block text-[10px] text-slate-500">Đã GQ - Quá hạn</label>
                            <input type="number" id="dt_pa_dgq_qh" class="w-full p-1 border rounded">
                            <label class="block text-[10px] text-slate-500">Chưa GQ - Trong hạn</label>
                            <input type="number" id="dt_pa_cgq_th" class="w-full p-1 border rounded">
                            <label class="block text-[10px] text-slate-500">Chưa GQ - Quá hạn</label>
                            <input type="number" id="dt_pa_cgq_qh" class="w-full p-1 border rounded">
                        </div>
                    </div>
                    </div>
            </section>

            <section class="bg-white p-6 rounded-xl border">
                <h3 class="font-black text-orange-600 mb-4 border-b pb-2 uppercase text-sm">2. Phản ánh 1022</h3>
                <div class="grid grid-cols-2 gap-8">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] font-bold">Đã xử lý</label><input type="number" id="pa_1022_xong" class="w-full p-2 border rounded"></div>
                        <div><label class="text-[10px] font-bold">Chưa xử lý</label><input type="number" id="pa_1022_cho" class="w-full p-2 border rounded"></div>
                        <div class="col-span-2"><label class="text-[10px] font-bold">Ghi chú</label><textarea id="pa_1022_danh_gia" class="w-full p-2 border rounded text-xs"></textarea></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg">
                        <div><label class="text-[10px]">Tiếng ồn</label><input type="number" id="pa_det_tieng_on" class="w-full p-1 border rounded"></div>
                        <div><label class="text-[10px]">Kinh tế/Hạ tầng</label><input type="number" id="pa_det_kinh_te" class="w-full p-1 border rounded"></div>
                        <div><label class="text-[10px]">Hành chính công</label><input type="number" id="pa_det_hcc" class="w-full p-1 border rounded"></div>
                        <div><label class="text-[10px]">Khác</label><input type="number" id="pa_det_khac" class="w-full p-1 border rounded"></div>
                    </div>
                </div>
            </section>

            <section class="bg-white p-6 rounded-xl border">
                <h3 class="font-black text-blue-900 mb-4 border-b pb-2 uppercase text-sm">3. 30 Chỉ tiêu KT-XH (%)</h3>
                <div class="grid grid-cols-5 gap-3" id="chi-tieu-container"></div>
            </section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            authDomain: "dashboarb-xabinhhung.firebaseapp.com",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
            appId: "1:152638135861:web:128ac8d51c8357b6521b7c"
        };
        const db = getDatabase(initializeApp(firebaseConfig));

        const container = document.getElementById('chi-tieu-container');
        for(let i=1; i<=30; i++) {
            container.innerHTML += `<div class="p-2 bg-slate-50 rounded border"><label class="block text-[9px] font-bold">CT ${i}</label><input type="number" step="0.01" id="ct_${i}" class="w-full p-1 border rounded text-xs font-bold"></div>`;
        }

        window.saveAllData = function() {
            const getV = (id) => parseFloat(document.getElementById(id)?.value) || 0;
            
            const ct30 = {};
            for(let i=1; i<=30; i++) ct30[`ct_${i}`] = getV(`ct_${i}`);

            const payload = {
                don_thu: {
                    phan_anh: { dgq_th: getV('dt_pa_dgq_th'), dgq_qh: getV('dt_pa_dgq_qh'), cgq_th: getV('dt_pa_cgq_th'), cgq_qh: getV('dt_pa_cgq_qh') },
                    khieu_nai: { dgq_th: 0, dgq_qh: 0, cgq_th: 0, cgq_qh: 0 }, // Cần thêm input ID tương ứng
                    to_cao: { dgq_th: 0, dgq_qh: 0, cgq_th: 0, cgq_qh: 0 }
                },
                pa_1022: {
                    thong_ke: { da_giai_quyet: getV('pa_1022_xong'), chua_giai_quyet: getV('pa_1022_cho'), danh_gia: document.getElementById('pa_1022_danh_gia').value },
                    linh_vuc: { tieng_on: getV('pa_det_tieng_on'), kinh_te_ha_tang: getV('pa_det_kinh_te'), hanh_chinh_cong: getV('pa_det_hcc'), khac: getV('pa_det_khac'), trat_tu_do_thi: 0, van_hoa_xa_hoi: 0 }
                },
                chi_tieu_30: ct30,
                khac: { ho_so_tong: 1250, van_ban_tong: 89 }
            };

            set(ref(db, 'dashboard_binhhung'), payload).then(() => alert("Cập nhật thành công!")).catch(e => alert(e.message));
        };
    </script>
</body>
</html>
