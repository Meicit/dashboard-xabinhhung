<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cập nhật số liệu Xã Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input-group { margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl overflow-hidden">
        <header class="bg-blue-900 text-white p-6 flex justify-between items-center">
            <h1 class="text-xl font-bold uppercase">Quản Trị Hệ Thống Chỉ Số 2026</h1>
            <button onclick="saveAll()" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded-lg font-bold transition-all">LƯU TẤT CẢ</button>
        </header>

        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            <section>
                <h3 class="font-black text-red-600 border-b-2 border-red-100 mb-4 uppercase">📂 Đơn thư & 1022</h3>
                <div class="grid grid-cols-2 gap-4 bg-red-50 p-4 rounded-lg">
                    <div><label>Tổng đơn thư</label><input type="number" id="dt_tong"></div>
                    <div><label>Đã GQ</label><input type="number" id="dt_da_giai_quyet"></div>
                    <div><label>Phản ánh 1022</label><input type="number" id="pa_1022_tong"></div>
                    <div><label>1022 Đã GQ</label><input type="number" id="pa_1022_xong"></div>
                </div>
                <div class="mt-4 p-4 border rounded-lg bg-slate-50">
                    <label>Đánh giá 1022</label>
                    <input type="text" id="pa_1022_danh_gia" placeholder="Nhập đánh giá chung...">
                </div>
            </section>

            <section>
                <h3 class="font-black text-blue-600 border-b-2 border-blue-100 mb-4 uppercase">📋 Hồ sơ & Văn bản</h3>
                <div class="space-y-4">
                    <div><label>Tổng hồ sơ hành chính</label><input type="number" id="hs_tong" class="text-2xl"></div>
                    <div><label>Tổng văn bản chỉ đạo</label><input type="number" id="vb_tong" class="text-2xl"></div>
                </div>
            </section>

            <section class="md:col-span-2">
                <h3 class="font-black text-green-700 border-b-2 border-green-100 mb-4 uppercase">📊 30 Chỉ tiêu kinh tế - xã hội (%)</h3>
                <div id="indicators-container" class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    </div>
            </section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            authDomain: "dashboarb-xabinhhung.firebaseapp.com",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
            appId: "1:152638135861:web:128ac8d51c8357b6521b7c"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        const rootRef = ref(db, 'dashboard_binhhung');

        // Khởi tạo 30 ô nhập chỉ tiêu
        const container = document.getElementById('indicators-container');
        for(let i=1; i<=30; i++) {
            container.innerHTML += `
                <div class="bg-white p-2 border rounded shadow-sm">
                    <label class="text-[9px]">Chỉ tiêu ${i}</label>
                    <input type="number" id="ct_${i}" step="0.1" value="0" class="text-sm">
                </div>
            `;
        }

        // Tải dữ liệu hiện tại từ Firebase lên form
        onValue(rootRef, (snap) => {
            const data = snap.val();
            if(!data) return;

            // Đổ dữ liệu đơn thư/1022
            document.getElementById('dt_tong').value = data.don_thu?.tong || 0;
            document.getElementById('dt_da_giai_quyet').value = data.don_thu?.da_giai_quyet || 0;
            document.getElementById('pa_1022_tong').value = data.pa_1022?.tong || 0;
            document.getElementById('pa_1022_xong').value = data.pa_1022?.da_giai_quyet || 0;
            document.getElementById('pa_1022_danh_gia').value = data.pa_1022?.danh_gia || "";
            
            // Đổ dữ liệu hồ sơ
            document.getElementById('hs_tong').value = data.ho_so?.tong || 0;
            document.getElementById('vb_tong').value = data.van_ban?.tong || 0;

            // Đổ dữ liệu 30 chỉ tiêu
            for(let i=1; i<=30; i++) {
                if(data.chi_tieu && data.chi_tieu[`ct_${i}`]) {
                    document.getElementById(`ct_${i}`).value = data.chi_tieu[`ct_${i}`];
                }
            }
        }, { onlyOnce: true });

        // Hàm lưu dữ liệu
        window.saveAll = () => {
            const updates = {
                don_thu: {
                    tong: Number(document.getElementById('dt_tong').value),
                    da_giai_quyet: Number(document.getElementById('dt_da_giai_quyet').value),
                    dang_giai_quyet: Number(document.getElementById('dt_tong').value) - Number(document.getElementById('dt_da_giai_quyet').value)
                },
                pa_1022: {
                    tong: Number(document.getElementById('pa_1022_tong').value),
                    da_giai_quyet: Number(document.getElementById('pa_1022_xong').value),
                    chua_giai_quyet: Number(document.getElementById('pa_1022_tong').value) - Number(document.getElementById('pa_1022_xong').value),
                    danh_gia: document.getElementById('pa_1022_danh_gia').value
                },
                ho_so: { tong: Number(document.getElementById('hs_tong').value) },
                van_ban: { tong: Number(document.getElementById('vb_tong').value) },
                chi_tieu: {}
            };

            for(let i=1; i<=30; i++) {
                updates.chi_tieu[`ct_${i}`] = Number(document.getElementById(`ct_${i}`).value);
            }

            set(rootRef, updates)
                .then(() => alert("✅ Đã cập nhật dữ liệu thành công!"))
                .catch(err => alert("❌ Lỗi: " + err));
        };
    </script>
</body>
</html>
