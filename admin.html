<div class="bg-white p-6 rounded-xl border border-blue-200 mt-6">
    <h3 class="text-lg font-bold text-blue-900 mb-4 uppercase">Cập nhật Hồ sơ TTHC</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div><label class="block text-xs font-bold mb-1">TỔNG HỒ SƠ</label>
             <input type="number" id="input_hs_tong" class="w-full border p-2 rounded"></div>
        <div><label class="block text-xs font-bold mb-1">HỒ SƠ TRỰC TUYẾN</label>
             <input type="number" id="input_hs_online" class="w-full border p-2 rounded"></div>
        <div><label class="block text-xs font-bold mb-1">TỶ LỆ ĐÚNG HẠN (%)</label>
             <input type="number" step="0.1" id="input_hs_dung_han" class="w-full border p-2 rounded"></div>
        <div><label class="block text-xs font-bold mb-1">QUÁ HẠN (Số lượng)</label>
             <input type="number" id="input_hs_qua_han" class="w-full border p-2 rounded"></div>
    </div>
    <button onclick="updateHoSo()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded font-bold uppercase text-sm">Lưu dữ liệu hồ sơ</button>
</div>

<script>
    // Hàm update cho Admin
    function updateHoSo() {
        const data = {
            tong: parseInt(document.getElementById('input_hs_tong').value),
            online: parseInt(document.getElementById('input_hs_online').value),
            dung_han_ty_le: parseFloat(document.getElementById('input_hs_dung_han').value),
            qua_han: parseInt(document.getElementById('input_hs_qua_han').value)
        };
        set(ref(db, 'dashboard_binhhung/ho_so'), data)
            .then(() => alert("Đã cập nhật thành công!"));
    }
</script>
