<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản trị Dashboard - UBND Xã Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 p-4 md:p-10 flex items-center justify-center min-h-screen">

    <div id="login-box" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-4xl">🔐</span>
        </div>
        <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-tight">Xác thực quyền Admin</h2>
        <input type="password" id="pass" class="w-full p-4 border-2 border-slate-100 rounded-2xl mb-4 text-center text-xl focus:border-blue-500 outline-none transition-all" placeholder="Nhập mật khẩu...">
        <button onclick="checkPass()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold uppercase shadow-lg hover:bg-blue-700 transition-all">Truy cập hệ thống</button>
    </div>

    <div id="admin-form" class="hidden w-full max-w-6xl bg-white p-8 rounded-[2rem] shadow-2xl overflow-y-auto max-h-[92vh]">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-blue-900 uppercase">Cập nhật số liệu xã Bình Hưng</h1>
                <p class="text-slate-400 text-xs font-bold">Dữ liệu sẽ được đồng bộ tức thì lên Dashboard</p>
            </div>
            <button onclick="save()" class="bg-emerald-600 text-white px-12 py-4 rounded-2xl font-black uppercase shadow-xl hover:scale-105 active:scale-95 transition-all">Lưu & Đẩy số liệu</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 shadow-sm border-l-8 border-red-500">
                    <h3 class="font-black text-red-600 mb-6 uppercase text-xs tracking-widest">📂 Quản lý đơn thư & Phản ánh</h3>
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">PA Kiến nghị<input type="number" id="pa_kn" class="w-full p-2 border rounded-lg mt-1 font-bold"></label>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Khiếu nại<input type="number" id="khieu_nai" class="w-full p-2 border rounded-lg mt-1 font-bold"></label>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Tố cáo<input type="number" id="to_cao" class="w-full p-2 border rounded-lg mt-1 font-bold"></label>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-t pt-6">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Tổng PA 1022<input type="number" id="pa_tong" class="w-full p-2 border rounded-lg mt-1 font-bold text-orange-600"></label>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">1022 Trễ hạn<input type="number" id="pa_tre" class="w-full p-2 border rounded-lg mt-1 font-bold text-red-600"></label>
                    </div>
                </div>

                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 shadow-sm border-l-8 border-blue-500">
                    <h3 class="font-black text-blue-600 mb-6 uppercase text-xs tracking-widest">📋 Hồ sơ & Văn bản</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Tổng hồ sơ HC<input type="number" id="hs_tong" class="w-full p-2 border rounded-lg mt-1 font-bold"></label>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">% Đúng hạn<input type="number" step="0.01" id="hs_pc" class="w-full p-2 border rounded-lg mt-1 font-bold text-emerald-600"></label>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">VB hoàn thành<input type="number" id="vb_tong" class="w-full p-2 border rounded-lg mt-1 font-bold"></label>
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 shadow-sm border-l-8 border-emerald-500">
                <h3 class="font-black text-emerald-600 mb-6 uppercase text-xs tracking-widest">📊 Tỷ lệ thực hiện 30 chỉ tiêu (%)</h3>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="ct-grid"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            authDomain: "dashboarb-xabinhhung.firebaseapp.com",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
            storageBucket: "dashboarb-xabinhhung.firebasestorage.app",
            messagingSenderId: "152638135861",
            appId: "1:152638135861:web:128ac8d51c8357b6521b7c"
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        const tenCT = ["Giá trị SP", "Thu ngân sách", "Giải ngân ĐTC", "BHYT dân", "BHXH lao động", "MN chuẩn QG", "TH chuẩn QG", "THCS chuẩn QG", "Số phòng học", "Tốt nghiệp THCS", "Giảm hộ nghèo", "Nông thôn mới", "Ấp văn hóa", "Gia đình VH", "Tiêm chủng trẻ", "Việc làm", "Mô hình du lịch", "Nước sạch", "Rác thải sinh hoạt", "Chất thải y tế", "Nước thải CN", "Hồ sơ đúng hạn", "Chữ ký số", "Tuyển quân", "Giảm tội phạm", "Khám phá án", "Giảm TNGT", "PCCC", "An ninh ma túy", "Xử lý PA 1022"];

        window.checkPass = () => {
            if(document.getElementById('pass').value === 'binhhung2026') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-form').classList.remove('hidden');
                renderCT();
                loadData();
            } else alert('Mật khẩu không đúng!');
        };

        function renderCT() {
            const grid = document.getElementById('ct-grid');
            tenCT.forEach((ten, i) => {
                grid.innerHTML += `<div class="flex flex-col bg-white p-2 rounded-xl border border-slate-200">
                    <label class="text-[8px] font-bold text-slate-400 uppercase leading-none mb-1">${i+1}. ${ten}</label>
                    <input type="number" step="0.1" id="ct_${i+1}" class="w-full border-none p-0 font-black text-blue-900 text-sm focus:ring-0" placeholder="0.0">
                </div>`;
            });
        }

        async function loadData() {
            const snap = await get(ref(db, 'dashboard_binhhung'));
            if(snap.exists()) {
                const d = snap.val();
                document.getElementById('pa_kn').value = d.don_thu?.pa_kn || 0;
                document.getElementById('khieu_nai').value = d.don_thu?.khieu_nai || 0;
                document.getElementById('to_cao').value = d.don_thu?.to_cao || 0;
                document.getElementById('pa_tong').value = d.pa_1022?.tong || 0;
                document.getElementById('pa_tre').value = d.pa_1022?.tre_han || 0;
                document.getElementById('hs_tong').value = d.ho_so?.tong || 0;
                document.getElementById('hs_pc').value = d.ho_so?.dung_han_pc || 0;
                document.getElementById('vb_tong').value = d.van_ban?.tong || 0;
                for(let i=1; i<=30; i++) document.getElementById(`ct_${i}`).value = d.chi_tieu?.[`ct_${i}`] || 0;
            }
        }

        window.save = async () => {
            const data = {
                don_thu: { pa_kn: +document.getElementById('pa_kn').value, khieu_nai: +document.getElementById('khieu_nai').value, to_cao: +document.getElementById('to_cao').value },
                pa_1022: { tong: +document.getElementById('pa_tong').value, tre_han: +document.getElementById('pa_tre').value },
                ho_so: { tong: +document.getElementById('hs_tong').value, dung_han_pc: +document.getElementById('hs_pc').value },
                van_ban: { tong: +document.getElementById('vb_tong').value },
                chi_tieu: {}
            };
            for(let i=1; i<=30; i++) data.chi_tieu[`ct_${i}`] = +document.getElementById(`ct_${i}`).value || 0;
            
            await set(ref(db, 'dashboard_binhhung'), data);
            alert('✅ Cập nhật số liệu thành công!');
        };
    </script>
</body>
</html>
