<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-black text-blue-900 uppercase">Cập nhật số liệu chuẩn 2026</h1>
            <button onclick="save()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold">LƯU HỆ THỐNG 💾</button>
        </div>

        <div class="grid grid-cols-2 gap-8 mb-8">
            <div class="space-y-4 bg-slate-50 p-4 rounded-xl">
                <h3 class="font-bold text-blue-700">TIẾP CÔNG DÂN (BIỂU 01)</h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>Lượt tiếp thường xuyên<input type="number" id="tcd_tx_luot" class="w-full p-1 border rounded"></div>
                    <div>Người tiếp thường xuyên<input type="number" id="tcd_tx_nguoi" class="w-full p-1 border rounded"></div>
                    <div>Lượt lãnh đạo tiếp<input type="number" id="tcd_ld_luot" class="w-full p-1 border rounded"></div>
                    <div>Người lãnh đạo tiếp<input type="number" id="tcd_ld_nguoi" class="w-full p-1 border rounded"></div>
                </div>
            </div>
            <div class="space-y-4 bg-slate-50 p-4 rounded-xl">
                <h3 class="font-bold text-red-600">XỬ LÝ ĐƠN THƯ (BIỂU 02)</h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>Tổng đơn Phản ánh<input type="number" id="dt_pa_tong" class="w-full p-1 border rounded"></div>
                    <div>Đơn PA Đất đai<input type="number" id="dt_pa_dat" class="w-full p-1 border rounded"></div>
                    <div>Tổng đơn Khiếu nại<input type="number" id="dt_kn_tong" class="w-full p-1 border rounded"></div>
                    <div>Đơn KN Đất đai<input type="number" id="dt_kn_dat" class="w-full p-1 border rounded"></div>
                    <div class="col-span-2">Số đơn KN đã thụ lý<input type="number" id="dt_kn_thuly" class="w-full p-1 border rounded"></div>
                </div>
            </div>
        </div>

        <h3 class="font-bold text-emerald-700 mb-4 uppercase">30 Chỉ tiêu KT-XH (% Thực hiện)</h3>
        <div id="ct-grid" class="grid grid-cols-5 md:grid-cols-10 gap-2"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7J3V97_gKwyAzpckTJm5j8hoMWU5aoFI",
            authDomain: "dashboarb-xabinhhung.firebaseapp.com",
            databaseURL: "https://dashboarb-xabinhhung-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dashboarb-xabinhhung",
            appId: "1:152638135861:web:128ac8d51c8357b6521b7c"
        };
        const db = getDatabase(initializeApp(firebaseConfig));

        const grid = document.getElementById('ct-grid');
        for(let i=1; i<=30; i++) grid.innerHTML += `<div class="bg-slate-50 border p-1 rounded text-center text-[10px]"><label>CT${i}</label><input type="number" step="0.1" id="ct_${i}" class="w-full text-center font-bold"></div>`;

        onValue(ref(db, 'dashboard_binhhung'), (snap) => {
            const d = snap.val(); if(!d) return;
            const ids = ['tcd_tx_luot','tcd_tx_nguoi','tcd_ld_luot','tcd_ld_nguoi','dt_pa_tong','dt_pa_dat','dt_kn_tong','dt_kn_dat','dt_kn_thuly'];
            ids.forEach(id => document.getElementById(id).value = d[id] || 0);
            for(let i=1; i<=30; i++) document.getElementById(`ct_${i}`).value = d[`ct_${i}`] || 0;
        });

        window.save = function() {
            const getV = (id) => parseFloat(document.getElementById(id).value) || 0;
            const data = {
                tcd_tx_luot: getV('tcd_tx_luot'), tcd_tx_nguoi: getV('tcd_tx_nguoi'),
                tcd_ld_luot: getV('tcd_ld_luot'), tcd_ld_nguoi: getV('tcd_ld_nguoi'),
                tcd_tong: getV('tcd_tx_luot') + getV('tcd_ld_luot'),
                dt_pa_tong: getV('dt_pa_tong'), dt_pa_dat: getV('dt_pa_dat'),
                dt_kn_tong: getV('dt_kn_tong'), dt_kn_dat: getV('dt_kn_dat'), dt_kn_thuly: getV('dt_kn_thuly'),
                dt_tong: getV('dt_pa_tong') + getV('dt_kn_tong'),
                pa_1022_tong: 192
            };
            for(let i=1; i<=30; i++) data[`ct_${i}`] = getV(`ct_${i}`);
            set(ref(db, 'dashboard_binhhung'), data).then(() => alert("Cập nhật thành công!"));
        };
    </script>
</body>
</html>
